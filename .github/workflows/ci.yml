name: CI

on:
  push:
    branches: [master, feature]
  pull_request:
    branches: [master]

# 质量门：typecheck / lint / build / test。
# lint：error 必须为 0；warning 用 --max-warnings=167 锁存量（2026-09-30 M7 批次后下调），
# 只减不增，归零后移除上限。typecheck 分三段：packages（根 tsconfig）/ server / dashboard。
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @simple-monitor/dashboard typecheck
      - run: pnpm lint:ci
      - run: pnpm build
      # server typecheck 消费 protocol 的构建产物（.d.ts 经 node_modules 链接解析；
      # server tsconfig 无 paths 源码映射，rootDir 限定 apps/server）——顺序不可前移，
      # 2874b50 曾因前移在 CI 无 dist 环境断裂（本地有 dist 掩盖，本地绿 ≠ CI 绿）
      - run: pnpm --filter @simple-monitor/server typecheck
      - run: pnpm test

  # ADR-6：自研 web-vitals vs 官方库 oracle 一致性（真实 chromium 双跑）
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:conformance

  # 发包兼容性背书（口径 Node ≥14，见 PUBLISH.md §兼容性）：node:14 容器内 require
  # 三包产物并断言行为。产物由 tsup 以 ES2020 target 预构建，消费方 Node 14 只需
  # require（CJS require 分支 + exports 条件 12.16+/14 全支持），无需本仓工具链。
  # 不声明 engines（神策 sa-sdk-javascript / axios 先例），此 job 是口径的验证依据。
  node14-smoke:
    runs-on: ubuntu-latest
    container: node:14
    steps:
      - uses: actions/checkout@v4
      - name: 组装依赖解析环境（workspace 软链 + zod 运行时依赖）
        run: |
          mkdir -p /smoke
          cd /smoke && npm init -y >/dev/null && npm install zod@3.24.1 --no-audit --no-fund
          mkdir -p node_modules/@simple-monitor
          ln -s "$GITHUB_WORKSPACE/packages/types" node_modules/@simple-monitor/types
          ln -s "$GITHUB_WORKSPACE/packages/utils" node_modules/@simple-monitor/utils
          ln -s "$GITHUB_WORKSPACE/packages/protocol" node_modules/@simple-monitor/protocol
      - name: Node 14 require 冒烟断言
        run: |
          NODE_PATH=/smoke/node_modules node -e "
            const assert = require('assert');
            process.chdir('/smoke');
            const types = require('@simple-monitor/types');
            const utils = require('@simple-monitor/utils');
            const protocol = require('@simple-monitor/protocol');
            assert(types.ErrorTypes && types.BreadCrumbTypes, 'types 枚举缺失');
            const masked = utils.maskDeep({ phone: '13812345678', traceId: 't-1' });
            assert(masked.phone === '[phone]', 'maskDeep 失效: ' + masked.phone);
            assert(masked.traceId === 't-1', '标识键被误伤');
            const ok = protocol.validateEnvelope({
              protocolVersion: protocol.PROTOCOL_VERSION,
              sentAt: 1,
              auth: { apiKey: 'k', sdk: { name: 't', version: '0' } },
              session: { sessionId: 's', trackerId: 't' },
              context: { page: '/' },
              events: [{ kind: 'perf', metrics: [{ name: 'fp', value: 100 }] }],
            });
            assert(ok.success === true, '信封校验失效: ' + JSON.stringify(ok.error?.issues));
            console.log('node14-smoke OK @ node', process.version);
          "
