name: CI

on:
  push:
    branches: [master, feature]
  pull_request:
    branches: [master]

# 质量门：typecheck / lint / build / test。
# lint：error 必须为 0；warning 用 --max-warnings=167 锁存量（2026-09-30 M7 批次后下调），
# 只减不增，归零后移除上限。typecheck 分三段：packages（根 tsconfig）/ server / dashboard。
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @simple-monitor/dashboard typecheck
      - run: pnpm lint:ci
      - run: pnpm build
      # server typecheck 消费 protocol 的构建产物（.d.ts 经 node_modules 链接解析；
      # server tsconfig 无 paths 源码映射，rootDir 限定 apps/server）——顺序不可前移，
      # 2874b50 曾因前移在 CI 无 dist 环境断裂（本地有 dist 掩盖，本地绿 ≠ CI 绿）
      - run: pnpm --filter @simple-monitor/server typecheck
      - run: pnpm test

  # ADR-6：自研 web-vitals vs 官方库 oracle 一致性（真实 chromium 双跑）
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:conformance

  # 发包兼容性背书（口径 Node ≥14，见 PUBLISH.md §兼容性）：Node 20 构建三包产物，
  # 在 node:14 容器内 require 断言。两个坑（CI 日志实证）：
  #  ① npm6 顺软链装依赖会遇 workspace:* 报 Unsupported 并剪枝软链——先装 zod 再建软链；
  #  ② dist 是构建产物不入库——容器验证前必须先构建三包。
  node14-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simple-monitor/types --filter @simple-monitor/utils --filter @simple-monitor/protocol build
      - name: Node 14 require 冒烟断言（node:14 容器）
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws node:14 bash -c "
            mkdir -p /smoke && cd /smoke
            npm init -y >/dev/null && npm install zod@3.24.1 --no-audit --no-fund >/dev/null 2>&1
            mkdir -p node_modules/@simple-monitor
            ln -s /ws/packages/types node_modules/@simple-monitor/types
            ln -s /ws/packages/utils node_modules/@simple-monitor/utils
            ln -s /ws/packages/protocol node_modules/@simple-monitor/protocol
            cp /ws/apps/dashboard/design/node14-smoke.js smoke.js
            node smoke.js
          "
